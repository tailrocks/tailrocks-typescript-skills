# Shared Tailrocks package structure and native resource validation.
# Update the immutable profile revision and SHA-256 together.
version: 1
extends:
  - https://raw.githubusercontent.com/tailrocks/tailrocks-skills/d7ace6576342d796094ab6f52cd2f6f5a4823ede/standards/alint/active.yml#sha256-f03da2d70a7606a0dbba386265e42dd0346cd43dd98edba9df833f3cb4aecd15
# Narrow ignore for rule skill-max-depth (exact paths, four files).
# Reason: the web-design assets mirror the real TanStack Start
# application layout (src/routes/design/...) that the skill teaches.
# Flattening them would break the skill task. Verified 2026-10-07:
# the files carry no executable bit and no retired alias, so this
# ignore hides no other finding.
ignore:
  - skills/tailrocks-web-design/assets/src/design/fixtures/settings.ts
  - skills/tailrocks-web-design/assets/src/design/registry.tsx
  - skills/tailrocks-web-design/assets/src/routes/design/$screen.$state.tsx
  - skills/tailrocks-web-design/assets/src/routes/design/route.tsx

rules:
  - id: native-package-valid
    kind: command_idempotent
    level: error
    command: ["python3", "scripts/validate-package.py", "--check"]
    message: "Native manifests, registrars, invocation policies, and bundled resources must agree."
